version: "3.9"

services:
  # Web Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: protocol_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # Next.js 16 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protocol_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:80/api
      - NEXT_PUBLIC_TYPESENSE_HOST=localhost
      - NEXT_PUBLIC_TYPESENSE_PORT=8108
      - NEXT_PUBLIC_TYPESENSE_PROTOCOL=http
      - NEXT_PUBLIC_TYPESENSE_SEARCH_KEY=abc
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # Laravel 13 Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protocol_backend
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=protocol_platform
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - TYPESENSE_HOST=typesense
    depends_on:
      - postgres
      - redis
      - typesense

  # Laravel Queue Worker
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protocol_queue
    command: php artisan queue:work redis --tries=3
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
      - postgres

  # Database: PostgreSQL 18.x
  postgres:
    image: postgres:18-alpine
    container_name: protocol_postgres
    environment:
      POSTGRES_DB: protocol_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache & Queues: Redis
  redis:
    image: redis:alpine
    container_name: protocol_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Fast Search: Typesense
  typesense:
    image: typesense/typesense:latest
    container_name: protocol_typesense
    command: '--data-dir /data --api-key=xyz --enable-cors'
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data

volumes:
  postgres_data:
  redis_data:
  typesense_data:
